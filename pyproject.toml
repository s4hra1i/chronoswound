[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoswound"
version = "0.3.0"
description = "Interpretable multimodal wound-age estimation research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "S. Ali"}]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.6",
  "scipy>=1.10",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
app = ["streamlit>=1.32"]

[project.scripts]
chronoswound = "chronoswound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
